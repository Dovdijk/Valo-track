plugins { id 'com.android.application' }

android {
    namespace 'nl.squadtracker.app'
    compileSdk 34
    defaultConfig {
        applicationId 'nl.squadtracker.app'
        minSdk 24
        targetSdk 34
        def vc = System.getenv('VERSION_CODE') ?: '1'
        versionCode = vc.toInteger()
        versionName = "1.0." + vc
        def site = System.getenv('SITE_URL') ?: 'https://dovdijk.github.io/Valo-track/'
        buildConfigField('String', 'SITE_URL', '"' + site + '"')
    }
    buildFeatures { buildConfig true }
    def ksPw = System.getenv('KEYSTORE_PASSWORD')
    signingConfigs {
        if (ksPw) {
            release {
                storeFile file(System.getenv('KEYSTORE_FILE') ?: 'release.keystore')
                storePassword ksPw
                keyAlias 'squad'
                keyPassword ksPw
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksPw) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
