name: Clips uploaden
on:
  push:
    branches: [clips-inbox]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload naar release "clips"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view clips >/dev/null 2>&1 || gh release create clips --title "Clips" --notes "Highlights en compilaties voor de Squad Tracker" --latest=false
          if ls clips/*.mp4 >/dev/null 2>&1; then gh release upload clips clips/*.mp4 --clobber; fi
          if [ -f clips/delete.txt ]; then while read -r f; do [ -n "$f" ] && gh release delete-asset clips "$f" -y || true; done < clips/delete.txt; fi
