name: Android-app bouwen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app-icon.png", "android/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Wachtwoord controleren
        id: pw
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Iconen maken uit app-icon.png
        run: |
          pip install --quiet pillow
          python android/make_icons.py app-icon.png

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Testbouw zonder wachtwoord
        if: steps.pw.outputs.ok != 'true'
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace assembleDebug
          echo "::error::De app bouwt, maar het secret ANDROID_KEYSTORE_PASSWORD ontbreekt nog. Zie de README, kopje Android-app."
          exit 1

      - name: Ondertekeningssleutel klaarzetten
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -f android/release.keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/release.keystore.enc -out android/app/release.keystore -pass env:PW
          else
            keytool -genkeypair -keystore android/app/release.keystore -alias squad -keyalg RSA -keysize 2048 \
              -validity 20000 -storepass "$PW" -keypass "$PW" -dname "CN=Squad Tracker, C=NL"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in android/app/release.keystore -out android/release.keystore.enc -pass env:PW
            git config user.name "squad-tracker-bot"
            git config user.email "squad-tracker-bot@users.noreply.github.com"
            git add android/release.keystore.enc
            git commit -m "Versleutelde ondertekeningssleutel voor de Android-app"
            git pull --rebase origin main && git push
          fi

      - name: APK bouwen
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: gradle --no-daemon assembleRelease

      - name: APK publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk SquadTracker.apk
          gh release view app >/dev/null 2>&1 || gh release create app --title "Squad Tracker Android-app" --notes "Download SquadTracker.apk en open het bestand op je Android-telefoon."
          gh release upload app SquadTracker.apk --clobber
          gh release edit app --notes "Versie 1.0.${{ github.run_number }}. Download **SquadTracker.apk** en open het bestand op je Android-telefoon."
